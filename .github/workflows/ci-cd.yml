name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend Test, Migrations & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx python-multipart pyyaml
          
      - name: Verify Alembic Migration History
        run: |
          python -m alembic -c database/alembic.ini history
          
      - name: Run Pytest Security and Regression Suite
        run: |
          python -m pytest tests/test_phase6_production_repair.py tests/test_featured_schemes_finder.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build
          npx tsc --noEmit

  docker-verification:
    name: Container Build & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t scheme-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t scheme-frontend:ci ./frontend
